name: Windows build

on:
  push:
    branches: [ atari-st, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release --target SugarConvDsk
      - name: Smoke test
        shell: bash
        run: ./build/SugarConvDsk/Release/SugarConvDsk.exe | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: SugarConvDsk-windows-x64
          path: build/SugarConvDsk/Release/SugarConvDsk.exe
